- id: strings.reverse
  title: Reverse a string
  tags: [strings]
  difficulty: 1
  kind: expression
  prompt: Return s reversed, without writing a loop.
  given: |
    String s = "stressed";
  asserts:
    - result.equals("desserts")
  structure:
    require: [call:reverse]
    forbid: [loop]
  hints:
    - "String has no reverse(), but another class does."
    - "new StringBuilder(s).reverse().toString()"
  reference: new StringBuilder(s).reverse().toString();

- id: strings.split-whitespace
  title: Split on whitespace
  tags: [strings, regex]
  difficulty: 2
  kind: expression
  prompt: Return a String[] of the four words in line, ignoring leading, trailing and repeated spaces.
  given: |
    String line = "  the   quick brown  fox ";
  asserts:
    - Arrays.equals(result, new String[] {"the", "quick", "brown", "fox"})
  structure:
    require: [call:split]
  hints:
    - "split takes a regex. Leading whitespace would otherwise produce an empty first element."
    - "line.strip().split(\"\\\\s+\")"
  reference: line.strip().split("\\s+");

- id: strings.substring-before
  title: Before the @
  tags: [strings]
  difficulty: 1
  kind: expression
  prompt: Return the part of email before the '@'.
  given: |
    String email = "ada@example.com";
  asserts:
    - result.equals("ada")
  structure:
    require: [call:substring|call:split]
  hints:
    - "indexOf finds the position of a character."
    - "email.substring(0, email.indexOf('@'))"
  reference: email.substring(0, email.indexOf('@'));

- id: strings.count-chars
  title: Count a letter
  tags: [strings, streams]
  difficulty: 2
  kind: expression
  prompt: Return how many times the letter 's' appears in word, as a long, without a loop.
  given: |
    String word = "mississippi";
  asserts:
    - result == 4L
  structure:
    forbid: [loop]
  hints:
    - "String.chars() gives an IntStream of the characters."
    - "word.chars().filter(c -> c == 's').count()"
  reference: word.chars().filter(c -> c == 's').count();

- id: strings.char-to-digit
  title: Character to digit
  tags: [strings, characters]
  difficulty: 1
  kind: expression
  prompt: Convert the digit character c to its int value (so '7' becomes 7).
  given: |
    char c = '7';
  asserts:
    - result == 7
  hints:
    - "chars are numbers. '0' through '9' are consecutive."
    - "c - '0'  (or Character.getNumericValue(c))"
  reference: c - '0';

- id: strings.format-zero-pad
  title: Zero-pad
  tags: [strings]
  difficulty: 1
  kind: expression
  prompt: Format n as a String padded with leading zeros to 5 digits ("00042").
  given: |
    int n = 42;
  asserts:
    - result.equals("00042")
  structure:
    require: [call:format|call:formatted]
  hints:
    - "String.format uses printf-style specifiers."
    - "%05d means: pad with zeros to width 5."
  reference: String.format("%05d", n);

- id: strings.equals-content
  title: Same content?
  tags: [strings]
  difficulty: 1
  kind: expression
  prompt: Return true if a and b contain the same characters.
  given: |
    String a = new String("java");
    String b = new String("java");
  cases:
    - asserts:
        - result
    - given: |
        String a = new String("Java");
        String b = new String("java");
      asserts:
        - '!result'
  structure:
    require: [call:equals]
  hints:
    - "== compares references, so two separately built strings are different objects."
    - "a.equals(b)"
  reference: a.equals(b);
  rejects:
    - a == b

- id: strings.regex-find-all
  title: Every number
  tags: [regex]
  difficulty: 3
  kind: statements
  prompt: |-
    Declare a List<String> named found holding every run of digits in text, in order, using Pattern and Matcher.
  given: |
    String text = "a1b22c333";
  asserts:
    - found.equals(List.of("1", "22", "333"))
  structure:
    require: [call:compile, call:find]
  hints:
    - "Pattern.compile gives a Pattern; pattern.matcher(text) gives a Matcher you can loop over."
    - "while (m.find()) { found.add(m.group()); } with the pattern \\d+"
  reference: |-
    List<String> found = new ArrayList<>();
    Matcher m = Pattern.compile("\\d+").matcher(text);
    while (m.find()) {
        found.add(m.group());
    }

- id: strings.regex-matches
  title: Five digits exactly
  tags: [regex]
  difficulty: 1
  kind: expression
  prompt: Return true if zip is exactly five digits.
  given: |
    String zip = "90210";
  cases:
    - asserts:
        - result
    - given: |
        String zip = "9021";
      asserts:
        - '!result'
    - given: |
        String zip = "902101";
      asserts:
        - '!result'
  hints:
    - "String.matches tests the whole string against a regex."
    - "zip.matches(\"\\\\d{5}\")"
  reference: zip.matches("\\d{5}");

- id: numbers.floor-mod
  title: Modulo that stays positive
  tags: [numbers]
  difficulty: 2
  kind: expression
  prompt: Return a mod 3 so that the result is never negative. For example -7 mod 3 is 2, not -1.
  given: |
    int a = -7;
  cases:
    - asserts:
        - result == 2
    - given: |
        int a = 7;
      asserts:
        - result == 1
  structure:
    require: [call:floorMod]
  hints:
    - "Java's % keeps the sign of the dividend. Math has a version that follows the divisor."
    - "Math.floorMod(a, 3)"
  reference: Math.floorMod(a, 3);
  rejects:
    - a % 3

- id: numbers.widen-before-multiply
  title: Multiply without overflow
  tags: [numbers]
  difficulty: 2
  kind: expression
  prompt: Return the product of a and b as a long that does not overflow.
  given: |
    int a = 100_000;
    int b = 100_000;
  asserts:
    - result == 10_000_000_000L
  hints:
    - "a * b is computed in int arithmetic before it is widened."
    - "Widen one operand first: (long) a * b"
  reference: (long) a * b;
  rejects:
    - a * b

- id: numbers.add-exact
  title: Detect overflow
  tags: [numbers, exceptions]
  difficulty: 2
  kind: statements
  prompt: |-
    Declare a boolean named overflowed that is true if big + 1 overflows an int. Use Math.addExact inside try/catch.
  given: |
    int big = Integer.MAX_VALUE;
  cases:
    - asserts:
        - overflowed
    - given: |
        int big = 5;
      asserts:
        - '!overflowed'
  structure:
    require: [call:addExact, try, catch]
  hints:
    - "The *Exact methods throw ArithmeticException instead of wrapping around."
    - "Set overflowed = true in the catch block."
  reference: |-
    boolean overflowed = false;
    try {
        Math.addExact(big, 1);
    } catch (ArithmeticException e) {
        overflowed = true;
    }

- id: numbers.parse-hex
  title: Parse hex
  tags: [numbers]
  difficulty: 1
  kind: expression
  prompt: Parse the hexadecimal String hex into an int.
  given: |
    String hex = "ff";
  asserts:
    - result == 255
  hints:
    - "Integer.parseInt has an overload taking a radix."
    - "Integer.parseInt(hex, 16)"
  reference: Integer.parseInt(hex, 16);

- id: numbers.double-average
  title: Fractional average
  tags: [numbers]
  difficulty: 1
  kind: expression
  prompt: Return total divided by count as a double (7 / 2 is 3.5, not 3).
  given: |
    int total = 7;
    int count = 2;
  asserts:
    - result == 3.5
  hints:
    - "Integer division truncates. At least one operand must be a double."
    - "(double) total / count"
  reference: (double) total / count;

- id: numbers.boxed-equality
  title: Boxed Integer equality
  tags: [numbers]
  difficulty: 2
  kind: expression
  prompt: Return true if the boxed Integers a and b hold the same value.
  given: |
    Integer a = 1000;
    Integer b = 1000;
  asserts:
    - result
  structure:
    require: [call:equals|call:intValue|call:compareTo]
  hints:
    - "== on boxed values compares references, and only small values are cached."
    - "a.equals(b)"
  reference: a.equals(b);
  rejects:
    - a == b

- id: bits.count-set-bits
  title: Count the 1 bits
  tags: [bits]
  difficulty: 1
  kind: expression
  prompt: Return the number of 1 bits in n.
  given: |
    int n = 0b1011_0110;
  asserts:
    - result == 5
  structure:
    require: [call:bitCount]
    forbid: [loop]
  hints:
    - "Integer has a static method for this."
    - "Integer.bitCount(n)"
  reference: Integer.bitCount(n);

- id: bits.power-of-two
  title: Power of two?
  tags: [bits]
  difficulty: 3
  kind: expression
  prompt: Return true if n is a power of two, using bit operations and no loop.
  given: |
    int n = 16;
  cases:
    - asserts:
        - result
    - given: |
        int n = 18;
      asserts:
        - '!result'
    - given: |
        int n = 0;
      asserts:
        - '!result'
    - given: |
        int n = 1;
      asserts:
        - result
  structure:
    forbid: [loop]
  hints:
    - "A power of two has exactly one bit set. n - 1 flips that bit and sets everything below it."
    - "n > 0 && (n & (n - 1)) == 0"
  reference: n > 0 && (n & (n - 1)) == 0;

- id: bits.set-bit
  title: Set a bit
  tags: [bits]
  difficulty: 2
  kind: expression
  prompt: Return mask with bit 3 (the one worth 8) turned on.
  given: |
    int mask = 0b0001;
  asserts:
    - result == 0b1001
  hints:
    - "1 << k builds a number with only bit k set."
    - "mask | (1 << 3)"
  reference: mask | (1 << 3);
